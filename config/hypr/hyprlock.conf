general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = __HOME__/Pictures/Wallpapers/cyberpunk.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    vibrancy = 0.2
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(00f0ffff)
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(00f0ff88)
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(ff00a0ff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = SpyOP
    color = rgba(d0f7ffff)
    font_size = 28
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# Password box
input-field {
    monitor =
    size = 340, 56
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(00f0ffff) rgba(ff00a0ff) 45deg
    inner_color = rgba(0d0221cc)
    font_color = rgba(00f0ffff)
    check_color = rgba(00f0ffff) rgba(ff00a0ff) 120deg
    fail_color = rgba(ff2a6dff)
    fade_on_empty = false
    placeholder_text = <span foreground="##ff00a0">enter password</span>
    fail_text = <span foreground="##ff2a6d">access denied</span>
    rounding = 14
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00f0ff66)
    position = 0, -130
    halign = center
    valign = center
}
