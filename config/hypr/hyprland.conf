monitor = eDP-1, 1920x1080@144, 0x0, 1
monitor = HDMI-A-1, 1920x1080@120, 1920x0, 1

$terminal = kitty
$menu = rofi -show drun

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    layout = dwindle
    resize_on_border = true
    col.active_border = rgba(00f0ffff) rgba(ff00aaff) 45deg
    col.inactive_border = rgba(25253aff)
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00f0ff66)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        vibrancy = 0.20
    }
}

animations {
    enabled = true

    bezier = cyber, 0.16, 1, 0.3, 1

    animation = windows, 1, 5, cyber, slide
    animation = windowsIn, 1, 5, cyber, slide
    animation = windowsOut, 1, 4, cyber, popin
    animation = border, 1, 6, default
    animation = fade, 1, 5, cyber
    animation = workspaces, 1, 5, cyber, slide
}

bind = SUPER, Q, exec, $terminal
bind = SUPER, C, killactive
bind = SUPER, M, exit

exec-once = awww-daemon
# exec-once = sleep 1 && awww img --resize crop ~/Pictures/Wallpapers/cyberpunk.png








bind = SUPER, D, exec, ~/.config/hypr/scripts/show-desktop.sh

bind = SUPER, H, exec, ~/.config/hypr/scripts/minimize-window.sh

bind = SUPER SHIFT, H, exec, ~/.config/hypr/scripts/hidden-windows.sh




# === WORKSPACES ===

# Move window to workspace

# === WAYBAR ===
exec-once = waybar

bind = SUPER, R, exec, rofi -show drun

exec-once = swaync



# Lock screen
bind = SUPER, RETURN, exec, $terminal

# --- Autostart hyprshell (Alt+Tab switcher with previews) ---
exec-once = hyprshell run

# --- 6 always-present desktops, like KDE ---

# --- Switch desktops (KDE default: Ctrl+F1..F6) ---

# --- Previous / next desktop ---

# --- Add a desktop: jump to the first empty workspace ---

# --- Send active window to a brand-new desktop ---

# --- Move window to desktop N (follow / silent) ---
bind = CTRL ALT, 1, movetoworkspace, 1
bind = CTRL ALT, 2, movetoworkspace, 2
bind = CTRL ALT, 3, movetoworkspace, 3
bind = CTRL ALT, 4, movetoworkspace, 4
bind = CTRL ALT, 5, movetoworkspace, 5
bind = CTRL ALT, 6, movetoworkspace, 6

bind = CTRL ALT SHIFT, 1, movetoworkspacesilent, 1
bind = CTRL ALT SHIFT, 2, movetoworkspacesilent, 2
bind = CTRL ALT SHIFT, 3, movetoworkspacesilent, 3
bind = CTRL ALT SHIFT, 4, movetoworkspacesilent, 4
bind = CTRL ALT SHIFT, 5, movetoworkspacesilent, 5
bind = CTRL ALT SHIFT, 6, movetoworkspacesilent, 6

# --- Scroll through desktops ---
bind = SUPER, mouse_down, exec, ~/.config/hypr/scripts/vdesk.sh next
bind = SUPER, mouse_up,   exec, ~/.config/hypr/scripts/vdesk.sh prev

# --- Combined desktops across both monitors ---
workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1
workspace = 11, monitor:HDMI-A-1, default:true
workspace = 12, monitor:HDMI-A-1
workspace = 13, monitor:HDMI-A-1
workspace = 14, monitor:HDMI-A-1
workspace = 15, monitor:HDMI-A-1
workspace = 16, monitor:HDMI-A-1

bind = CTRL ALT, right, exec, ~/.config/hypr/scripts/vdesk.sh next
bind = CTRL ALT, left,  exec, ~/.config/hypr/scripts/vdesk.sh prev
bind = SUPER CTRL, N, exec, ~/.config/hypr/scripts/vdesk.sh grow
bind = SUPER CTRL, D, exec, ~/.config/hypr/scripts/vdesk.sh shrink

bind = SUPER, 1, exec, ~/.config/hypr/scripts/vdesk.sh go 1
bind = SUPER, 2, exec, ~/.config/hypr/scripts/vdesk.sh go 2
bind = SUPER, 3, exec, ~/.config/hypr/scripts/vdesk.sh go 3
bind = SUPER, 4, exec, ~/.config/hypr/scripts/vdesk.sh go 4
bind = SUPER, 5, exec, ~/.config/hypr/scripts/vdesk.sh go 5
bind = SUPER, 6, exec, ~/.config/hypr/scripts/vdesk.sh go 6

# --- Float all windows by default (KDE-style stacking) ---

# --- Maximize every new window (keeps border/glow) ---

# --- Move focused window to next/prev desktop ---
bind = CTRL ALT SHIFT, right, exec, ~/.config/hypr/scripts/vdesk.sh movenext
bind = CTRL ALT SHIFT, left,  exec, ~/.config/hypr/scripts/vdesk.sh moveprev

# --- Keep both monitors on the same desktop ---
exec-once = ~/.config/hypr/scripts/vdesk-sync.sh

# --- Audio / Bluetooth popups ---

# --- TUI popups ---
windowrule = float on, match:class popup-audio
windowrule = float on, match:class popup-bt
windowrule = size 800 500, match:class popup-audio
windowrule = size 700 450, match:class popup-bt
windowrule = center on, match:class popup-audio
windowrule = center on, match:class popup-bt

misc {
    focus_on_activate = true
}

windowrule = float on, match:class popup-net
windowrule = size 700 450, match:class popup-net
windowrule = center on, match:class popup-net

# --- Screenshot region (Windows-style) ---
bind = SUPER SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh
bind = , Print, exec, grim - | wl-copy
exec-once = env LD_PRELOAD=/usr/lib/libgtk4-layer-shell.so python3 __HOME__/.config/hypr/scripts/rain.py

layerrule = blur off, match:namespace rain
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
bind = SUPER, B, exec, ~/.config/hypr/scripts/bt-profile.sh
exec-once = hypridle

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
env = QT_QPA_PLATFORMTHEME,kde
bind = SUPER, L, exec, pidof hyprlock || hyprlock

# Move focused window to the left / right monitor
bind = SUPER SHIFT, left,  movewindow, mon:eDP-1
bind = SUPER SHIFT, right, movewindow, mon:HDMI-A-1
bind = SUPER, F, fullscreen, 0
bind = SUPER SHIFT, F, togglefloating
bind = SUPER SHIFT, M, fullscreen, 1
bind = SUPER, I, exec, ~/.config/hypr/scripts/toggle-idle.sh
bind = CTRL ALT, I, exec, ~/.config/hypr/scripts/toggle-idle.sh

# --- Power panel popup ---
windowrule = float on, match:class local.powerpanel
windowrule = size 340 190, match:class local.powerpanel
windowrule = center on, match:class local.powerpanel

# --- Theme switcher ---
bind = SUPER SHIFT, 1, exec, ~/.config/hypr/scripts/theme.sh cyberpunk
bind = SUPER SHIFT, 2, exec, ~/.config/hypr/scripts/theme.sh macos
bind = SUPER SHIFT, 3, exec, ~/.config/hypr/scripts/theme.sh red
bind = SUPER SHIFT, 4, exec, ~/.config/hypr/scripts/theme.sh green
exec-once = sleep 2 && ~/.config/hypr/scripts/theme.sh restore
source = ~/.config/hypr/theme.conf

# --- Waybar blur ---
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.1, match:namespace waybar
bindn = , Z, exec, ~/.config/hypr/scripts/autoclick.sh

# --- Desktops 7-10 (laptop) and 17-20 (HDMI) ---
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1
workspace = 17, monitor:HDMI-A-1
workspace = 18, monitor:HDMI-A-1
workspace = 19, monitor:HDMI-A-1
workspace = 20, monitor:HDMI-A-1

bind = SUPER, 7, exec, ~/.config/hypr/scripts/vdesk.sh go 7
bind = SUPER, 8, exec, ~/.config/hypr/scripts/vdesk.sh go 8
bind = SUPER, 9, exec, ~/.config/hypr/scripts/vdesk.sh go 9
bind = SUPER, 0, exec, ~/.config/hypr/scripts/vdesk.sh go 10

# --- Focus between tiled windows ---
bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d
bind = CTRL ALT SHIFT, U, exec, sudo -n /usr/local/bin/usb-reset

# --- Clipboard history ---
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
bind = SUPER, V, exec, cliphist list | rofi -dmenu -p Clipboard | cliphist decode | wl-copy
bind = , F12, exec, ~/.config/hypr/scripts/dropterm.sh

# --- Popups: cava, dropdown terminal, satty ---
windowrule = float on, match:class popup-cava
windowrule = size 900 400, match:class popup-cava
windowrule = center on, match:class popup-cava
windowrule = float on, match:class dropterm
windowrule = size 1200 500, match:class dropterm
windowrule = center on, match:class dropterm
windowrule = float on, match:class com.gabm.satty
windowrule = size 900 600, match:class com.gabm.satty
windowrule = center on, match:class com.gabm.satty
